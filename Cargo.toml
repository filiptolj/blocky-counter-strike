[package]
name = "cs-blocky"
version = "0.1.0"
edition = "2024"
description = "A Counter-Strike style 5v5 shooter with blocky graphics"
license = "MIT"
repository = "https://github.com/filiptolj/blocky-counter-strike"

[dependencies]
# Audio (ALSA) and gamepads (udev) are left out for now: they need system libs
# that require `sudo apt install libasound2-dev libudev-dev pkg-config`.
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "default_font",
    "3d_api",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
] }

# Sound is only enabled on Windows: on Linux/WSL it needs ALSA development packages.
[target.'cfg(windows)'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_audio", "wav"] }

# Bevy is very slow in debug builds; optimize dependencies but keep our code fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
